<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Japan Weather App</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <section class="siderbar">
      <div class="search-bar-container">
        <input
          type="text"
          placeholder="Enter a town, city or country"
          class="location-input-field"
        />
        <button class="search-button">What's the weather?</button>
      </div>
    </section>

    <section class="main-display-area">
      <div class="weather-icon">
        <img class="weather-icon-data" src="#" alt="weather icon displayed here" />
      </div>
      <div class="weather-data-container">
        <div class="weather-condition-container">
          General Weather Condition:
          <span class="weather-condition-data">Sunny</span>
        </div>
        <div class="temp-container">
          Temperature: <span class="temp-data">56</span>
        </div>
        <div class="feels-like-container">
          Feels like: <span class="feels-like-data">60 RIP</span>
        </div>
        <div class="temp-conversion-button-container">
          <button class="temp-conversion-button">Convert to celsius</button>
        </div>
      </div>
    </section>
  </body>
</html>
